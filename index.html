<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PX to REM Converter | Jesse DevUtils</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">
    <nav class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="https://devutils-io.netlify.app" class="flex items-center gap-2 group">
                <div class="h-8 w-8 bg-gradient-to-br from-teal-500 to-blue-600 rounded flex items-center justify-center font-bold text-white text-sm">D</div>
                <span class="text-slate-300 group-hover:text-white font-medium transition-colors">Back to DevUtils.io</span>
            </a>
            <div class="hidden md:block text-xs text-slate-500 font-mono italic">Professional Utility Hub &bull; v1.0</div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-8">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">PX &rarr; REM Converter</h1>
        <p class="text-slate-400 mb-8">Convert Pixels to Rem units for responsive layouts.</p>
        
        <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs font-bold mb-2 text-slate-500 uppercase">Pixels (px)</label>
                    <input type="number" id="px" class="w-full bg-slate-900 border border-slate-700 p-4 rounded text-2xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="16">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-2 text-slate-500 uppercase">Result (rem)</label>
                    <input type="text" id="rem" readonly class="w-full bg-slate-950 border border-slate-800 p-4 rounded text-2xl text-blue-300 font-mono" placeholder="1rem">
                </div>
            </div>
        </div>
    </div>

    <script>
        const pxInput = document.getElementById('px');
        const remOutput = document.getElementById('rem');
        pxInput.addEventListener('input', (e) => {
            if(!e.target.value) { remOutput.value = ''; return; }
            remOutput.value = (e.target.value / 16).toFixed(3).replace(/\.?0+$/, "") + 'rem';
        });
    </script>
</body>
</html>
